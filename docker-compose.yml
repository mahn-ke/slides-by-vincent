#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:9068247b4c525a449e8b5c746cdeb74e789098a0c5f583a3c240640b54d47c80
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
