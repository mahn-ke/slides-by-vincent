#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:93a95e205532aaecb3de14d5b69cbf5a701f60633bab34aa7d1df6870ec92fbd
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
