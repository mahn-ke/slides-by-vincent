#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:8b21456ce0d08b38a428762e4d82a07a42e8a99ea95c72ccc2f7fc975c9718e1
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
