#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:a29e847d8a5e0e769350c79ad685542a1f9c334cacdce1e59b47da3bbb0ff39c
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
