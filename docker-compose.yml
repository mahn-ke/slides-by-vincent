#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:7b4b85ded4267e5cb5fd2fd02557bf24a84aba10581e7020725d5d4bd92c960e
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
