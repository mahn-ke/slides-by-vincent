#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:ddf361e5369ad32c8b9e4394d0fa71d3f867602ea8dd3b3934a987eabd9a7bbc
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
