#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:e88bb1664400c9c1e1663e450037373f04e727dbf48170ca491eb161d32a7b37
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
