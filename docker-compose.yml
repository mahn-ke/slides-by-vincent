#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:37e78e0f1eab5c1322b2bd2cb55e4dc124cccddf67eaddc2b46b8a6e50d2efe5
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
