#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:400fe3896f75bdcc06065016d7fa8efcd53b594b3910756194581438c2931f89
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
