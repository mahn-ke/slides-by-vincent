#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:c252632fe0ca757bff281e5bdf7c598880f8717b1728db153fad1276d70b1df1
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
