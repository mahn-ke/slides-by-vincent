#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:49e4c4ab538d624b446b9aacf74d04b08f23daf9b76704c79da7bab7b1b08e3e
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
