#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:a9e8d9affdcc36bef9fd7b59604bafe5ce7b5d53adf103b153645b0a7fdf931b
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
