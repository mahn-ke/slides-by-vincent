#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:108bde92cc3bcfb786c3aab3ea9441d2b717f4705745e499e1ed779d30877b2b
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
