#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:86ac21cd3ee4be90bd5b8f56ec3710dab5e6c260b3a679979a20176d966ae7a4
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
