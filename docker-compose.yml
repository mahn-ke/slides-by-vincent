#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:dcae93a9edd68acb9b97a78fdcafe9d12014379452255bd9f66bf54f146d4bca
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
