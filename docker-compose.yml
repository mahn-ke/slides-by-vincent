#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:73c701174ddaef6b51748e674cb2c615020147a306cc2e1523408cd28b2f1532
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
