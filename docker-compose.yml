#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:8a14c3dbfd441e17791a0d01b8c9c441ff0de31dd54da2a6f50ff3c3a61b2592
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
