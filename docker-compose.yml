#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:1e9dd5d3e7f977ed14122817875c7fa7eff2a17968ea74d345a2659d262897bc
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
