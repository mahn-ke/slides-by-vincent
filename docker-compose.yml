#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:bd5f4c021c72912b6519d6b32a403e59590fe31b1caecd5af65964652f242838
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
