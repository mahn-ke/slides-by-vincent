#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:7ec0fa39964c01d1c061aa05b6cecc98d10c41181d9b0f0799a984f9445447b6
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
