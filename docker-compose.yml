#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:a1a436f81407e240b6563bb907bdb84c9d76c4a2c232fd15c15e2627549cc86d
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
