#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:538c0dff7b50ec3fb72ecdaaa570ffff2e6aa1bfb3ee194c74239ae9d0302f17
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
