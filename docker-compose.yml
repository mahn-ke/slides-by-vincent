#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:5d2c4077bf7b028af0a92ed23a012b1b230e9d2b87f2705e56f0005d64f60fe6
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
