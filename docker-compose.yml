#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:f43aced65fd5ab0b1f5825448745e66bc6ebfd07074af325d7936a827fa7c9cf
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
