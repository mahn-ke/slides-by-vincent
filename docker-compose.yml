#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:29ff3bbe21cc4ff1a4cb621c7e56d749b7a01b8364004a0759d91d17d6699523
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
