#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:8f16984616633ef04be89aa315140b8f45a8f2043cf5dedc34ce3a0449a4b0d3
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
