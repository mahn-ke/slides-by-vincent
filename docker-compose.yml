#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:f97dd4db34b71d379e44b6d6638fbc27c429494f0f86efef29dba5a9085ac8eb
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
