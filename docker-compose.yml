#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:f51ae2f63e82deea28751383de82330298f2fe687f50f597a69cc677bf67e78a
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
