#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:24c061f5fabbc37d67a4f06695e56486c984923b5dbb1316404eafb2c681a2c8
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
