#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:dde7a2909c0e5c00708207b3bf13d1400403ef13bc57efbac666cdd10d2239e5
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
