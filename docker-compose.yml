#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:4caa59067f25bb17d97521e8cd3ee665169ea086c50cbd7b9c9baa2db20d17e8
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
