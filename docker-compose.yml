#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:8898b919928e5000ca256e99aa2a687c32198abd95ae8fbfe6c352d7fa662fd3
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
