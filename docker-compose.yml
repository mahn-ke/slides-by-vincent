#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:ae8a1f897bfc7c624735b2611efb8e032a69ab1d44a14bb487efccafe66842ba
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
