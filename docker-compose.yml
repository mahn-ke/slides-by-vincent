#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:f0b18efcaf1328fb2762e1b0b73c1f89a0adc3595b9f2ba3cbc7acc92b22d426
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
