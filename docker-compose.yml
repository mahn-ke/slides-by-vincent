#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:fc466b1d87a3165d3cfb48e1fbd113bde5c4ed98b535391d31fe468c4ecb3eb6
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
