#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:d5a1349c485ca021272211c3b39373f8c500f60176701e503f9c9e334626522c
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
