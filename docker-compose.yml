#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:eff37210ff5b48ed77f7c27dbd1beaa94bc0a91371a47453fa2dec75d0f65351
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
