#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:7624a7af73f2fb2911342795b2f27765088a0e116b54ffdf1175694bd44f79e4
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
