#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:7c0c46aed5b8b1bd9703dd38f8947691165f3065a0cc3013e9bf7cd7e70087f6
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
