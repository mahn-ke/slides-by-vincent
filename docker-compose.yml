#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:3ee3e740b2acdeb98f43659416c3d10b75003ac0b04e9e58906792c107cbfe7e
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
