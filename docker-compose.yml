#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:3adf7ec19f34b71180928c8cb5921433a4041783c074e8358b86bf1ac39b9cf2
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
