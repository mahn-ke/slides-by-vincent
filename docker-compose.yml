#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:f2dcbc5293d117ce3ea54e59bcc0b6de36d4f9740f877d8e089c031eb3611159
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
