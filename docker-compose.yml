#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:91f480b24f0a19780bb5159f2a532a32adaf00aa71105f2e7b2dc0e8ebeedda1
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
