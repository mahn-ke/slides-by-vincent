#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:d4d1795264a81923310973d50ba488149227be86e53eac8d51920648f4326e58
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
