#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:5f32de1f0b45d2a8711a98ae5fbcce1991f44733337af2685b8b44bbc1eb0b8d
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
