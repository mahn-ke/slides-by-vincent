#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:69ed10f831fedc7d226709ce1b0d954a1b667c56c84fc777b1f1a647455cea35
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
