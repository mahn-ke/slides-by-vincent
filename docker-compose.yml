#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:41dc62075ee00bb21d89e248d0c99ab833aff4f89d09ae1d43eee5313cfecd75
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
