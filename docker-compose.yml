#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:a7291c1febbb44604d5c0105d122b4abb2345e0f68a8fe9464f7cce67fca0ea1
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
