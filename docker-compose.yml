#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:9cf65d1bfc0a2b0065b2e96a34387398628d50967a869ccf83fbdeca33d40e4a
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
