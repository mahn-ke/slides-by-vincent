#http
services:
  app:
    image: ghcr.io/mahn-ke/slides-by-vincent:latest@sha256:63639e4d25d66de079949ffb616dac10187353ea68a52d8f311fdcbb097b4ad6
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3009:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
